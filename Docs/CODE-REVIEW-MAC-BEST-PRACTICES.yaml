medium_priority_issues:

  - id: MED-001
    title: ".sheet() for Shortcode Picker (Should Be Popover)"
    severity: medium
    category: interaction
    impact: "iOS-style modal instead of Mac-style popover"
    description: |
      Shortcode picker uses .sheet() which is iOS-style modal presentation.
      macOS would typically use .popover() for this type of auxiliary UI.
    files_affected:
      - path: "Victor/Views/MainWindow/EditorPanelView.swift"
        lines: [159, 163]
    fix:
      code_change: "Change .sheet() to .popover()"
      before: |
        .sheet(isPresented: $showShortcodePicker) {
            ShortcodePickerView { ... }
        }
      after: |
        .popover(isPresented: $showShortcodePicker, arrowEdge: .leading) {
            ShortcodePickerView { ... }
                .frame(minWidth: 400, minHeight: 500)
        }
    estimated_effort: "20 minutes"

  - id: MED-002
    title: "TabView in Preferences (Should Use Segmented Picker)"
    severity: medium
    category: interaction
    impact: "Less Mac-native than segmented control for preferences"
    files_affected:
      - path: "Victor/Views/Preferences/PreferencesView.swift"
        lines: [14, 31]
    fix:
      code_change: "Replace TabView with Picker + .pickerStyle(.segmented)"
      note: "Current implementation works, but segmented picker is more Mac-like"
    estimated_effort: "45 minutes"

  - id: MED-003
    title: "Hard-coded Badge Colors (Should Be Semantic)"
    severity: medium
    category: styling
    impact: "Colors don't adapt to themes"
    files_affected:
      - path: "Victor/Views/MainWindow/FileListView.swift"
        lines: [159, 170]
        colors: [".purple", ".orange"]
      - path: "Victor/Views/Editor/ShortcodeCardView.swift"
        lines: [30, 41]
        colors: [".orange", ".blue"]
    fix:
      code_change: "Create semantic color constants or use SF Symbol tints"
      example: |
        // Define in AppConstants or theme file:
        static let pageBundleColor = Color(nsColor: .systemPurple)
        static let configColor = Color(nsColor: .systemOrange)
    estimated_effort: "30 minutes"

  - id: MED-004
    title: "Border Stroke Width 2pt (Should Be 1pt)"
    severity: medium
    category: styling
    impact: "Heavy borders compared to macOS standards"
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [301, 304]
    fix:
      code_change: "Change lineWidth from 2 to 1"
    estimated_effort: "5 minutes"

  - id: MED-005
    title: "Fixed Font Sizes (Should Use Semantic Sizes)"
    severity: medium
    category: accessibility
    impact: "Doesn't adapt to accessibility text sizes"
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetDetailPanel.swift"
        lines: [100]
        size: 48
      - path: "Victor/Views/Editor/TextEditorPanel.swift"
        lines: [66]
        size: 12
    fix:
      code_change: "Use .title, .headline, .body, .caption instead"
      exception: "Keep fixed sizes for monospaced code displays"
    estimated_effort: "20 minutes"

  - id: MED-006
    title: "Missing Hover Feedback on Inspector Section Headers"
    severity: medium
    category: interaction
    impact: "Not obvious that section headers are clickable"
    files_affected:
      - path: "Victor/Views/Inspector/InspectorPanel.swift"
    fix:
      code_change: "Add .onHover with subtle background highlight"
    estimated_effort: "20 minutes"

  - id: MED-007
    title: ".ignoresSafeArea() in FocusModeView"
    severity: medium
    category: api_usage
    impact: "iOS-only modifier, has no effect on macOS"
    files_affected:
      - path: "Victor/Views/FocusMode/FocusModeView.swift"
        lines: [17]
    fix:
      code_change: "Remove .ignoresSafeArea() modifier"
    estimated_effort: "2 minutes"

  - id: MED-008
    title: "Missing Window State Restoration"
    severity: medium
    category: persistence
    impact: "Window position/size not persisted across launches"
    description: |
      Window opens at system default position and size every time.
      Should use @SceneStorage to persist window geometry.
    files_affected:
      - path: "Victor/VictorApp.swift"
        lines: [10, 14]
    fix:
      code_change: "Add .defaultSize() and consider @SceneStorage"
      example: |
        .frame(minWidth: 1000, minHeight: 600)
        .defaultSize(width: 1200, height: 800)
    estimated_effort: "1 hour"

  - id: MED-009
    title: "Missing Selected File Persistence"
    severity: medium
    category: persistence
    impact: "App reopens with no file selected"
    files_affected:
      - path: "Victor/ViewModels/SiteViewModel.swift"
    fix:
      code_change: "Add @SceneStorage for selectedFileID"
      example: |
        @SceneStorage("selectedFileID") private var selectedFileID: UUID?
    estimated_effort: "30 minutes"

  - id: MED-010
    title: "Preferences Window Fixed Size"
    severity: medium
    category: ux
    impact: "Window too small if content expands"
    files_affected:
      - path: "Victor/Views/Preferences/PreferencesView.swift"
        lines: [32]
    fix:
      code_change: "Make resizable with min/max constraints"
    estimated_effort: "10 minutes"

