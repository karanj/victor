      - "Keyboard navigation (arrow keys) works"

  - area: "Asset Browser"
    description: "After adding context menus and removing tap gestures"
    tests:
      - "Right-click shows context menu"
      - "Insert markdown action works"
      - "Copy path action works"
      - "Reveal in Finder works"
      - "Grid and list selection still works"
      - "Drag-drop insertion still works"

  - area: "Form Controls"
    description: "After changing to .checkbox style"
    tests:
      - "All toggles render as checkboxes"
      - "Toggle state changes work correctly"
      - "Config editor toggles save properly"
      - "Preferences toggles update @AppStorage"

  - area: "Text Fields"
    description: "After removing .roundedBorder"
    tests:
      - "Text fields render with native macOS appearance"
      - "Focus states work correctly"
      - "Placeholder text displays properly"
      - "Text input and editing works"

  - area: "Window Restoration"
    description: "After adding @SceneStorage"
    tests:
      - "Window position persists across launches"
      - "Window size persists across launches"
      - "Selected file restores on relaunch"
      - "Sidebar width persists"

