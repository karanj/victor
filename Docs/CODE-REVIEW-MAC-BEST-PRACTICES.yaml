  - id: HIGH-010
    title: "Missing Tooltips on Status Badges"
    severity: high
    category: accessibility
    impact: "Users don't know what Draft/Scheduled/Expired badges mean"
    files_affected:
      - path: "Victor/Views/MainWindow/FileListView.swift"
        lines: [164, 177, 286, 308]
    fix:
      code_change: "Add .help() modifiers to explain badge meanings"
      example: |
        .help("Draft: Not published in production build")
    estimated_effort: "15 minutes"

