# Victor macOS Best Practices Code Review
# Generated: 2026-01-06
# Review Focus: iOS-specific patterns and macOS HIG compliance

metadata:
  total_issues: 68
  critical: 12
  high: 18
  medium: 24
  low: 14
  files_affected: 28
  review_date: "2026-01-06"
  reviewers: "Expert Code Review Panel"

executive_summary: |
  The Victor codebase demonstrates strong macOS-first design overall with excellent
  security-scoped bookmark implementation, proper command system, and good lifecycle
  management. However, several iOS-specific patterns were identified:

  KEY FINDINGS:
  - 11+ files using .textFieldStyle(.roundedBorder) (iOS-style)
  - 6 instances of .onTapGesture conflicting with List selection
  - Missing .toggleStyle(.checkbox) on 8+ Toggle controls
  - No context menus in Asset Browser (significant UX gap)
  - Missing window state restoration with @SceneStorage
  - .navigationSubtitle() used but has no effect on macOS

  OVERALL ASSESSMENT: 75/100
  - Strong foundation with macOS-specific patterns (NavigationSplitView, HSplitView)
  - No iOS-only imports or APIs detected
  - Main issues are styling choices rather than architectural problems
  - Recommended fixes are straightforward and low-risk

# ============================================================================
# CRITICAL PRIORITY ISSUES
# ============================================================================

critical_issues:

  - id: CRIT-001
    title: ".textFieldStyle(.roundedBorder) - iOS Visual Style"
    severity: critical
    category: styling
    impact: "Visual inconsistency with macOS native apps"
    description: |
      11+ files use .textFieldStyle(.roundedBorder) which is iOS-style.
      macOS should use default system style (.automatic) for native appearance.
    files_affected:
      - path: "Victor/Views/ConfigEditor/ConfigEditorView.swift"
        lines: [204, 214, 223, 237, 251, 344, 350, 384, 396]
        instances: 9
      - path: "Victor/Views/Editor/Components/CustomFieldEditor.swift"
        lines: [120, 132]
        instances: 2
      - path: "Victor/Views/Editor/Components/MenuEntryEditor.swift"
        lines: [37, 48, 62, 73, 89, 100, 112]
        instances: 7
      - path: "Victor/Views/Editor/Tabs/MenusTab.swift"
        lines: [88]
        instances: 1
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [127]
        instances: 1
      - path: "Victor/Views/Editor/FrontmatterEditorView.swift"
        lines: [129]
        instances: 1
      - path: "Victor/Views/Editor/Tabs/EssentialFieldsTab.swift"
        lines: [15]
        instances: 1
      - path: "Victor/Views/Inspector/MetadataSection.swift"
        lines: [16, 159]
        instances: 2
      - path: "Victor/Views/Editor/ShortcodeFormView.swift"
        lines: [199]
        instances: 1
      - path: "Victor/Views/Editor/Components/HelpTooltip.swift"
        lines: [125, 177, 289]
        instances: 3
    fix:
      code_change: "Remove .textFieldStyle(.roundedBorder) modifier"
      before: |
        TextField("Base URL", text: $config.baseURL)
            .textFieldStyle(.roundedBorder)
      after: |
        TextField("Base URL", text: $config.baseURL)
            // System default style is native on macOS
    estimated_effort: "30 minutes"

  - id: CRIT-002
    title: ".onTapGesture Conflicts with List Selection"
    severity: critical
    category: interaction
    impact: "Duplicate and conflicting selection handlers"
    description: |
      FileListView uses .onTapGesture for selection AND List(selection:) binding,
      creating conflicting input patterns. List should handle selection natively.
    files_affected:
      - path: "Victor/Views/MainWindow/FileListView.swift"
        lines: [30, 34, 50, 92, 96, 111]
        instances: 6
    fix:
      code_change: "Remove .onTapGesture modifiers, rely on List's selection binding"
      before: |
        FileRowView(node: node)
            .onTapGesture(count: 2) { node.isExpanded.toggle() }
            .onTapGesture { siteViewModel.selectNode(node) }
      after: |
        FileRowView(node: node)
            // List(selection:) binding handles clicks natively
            // DisclosureGroup handles expand/collapse
    estimated_effort: "1 hour"
    testing_required: true

  - id: CRIT-003
    title: "Missing .toggleStyle(.checkbox) on macOS Forms"
    severity: critical
    category: styling
    impact: "iOS-style toggle switches instead of Mac checkboxes"
    description: |
      Toggle controls in forms use default style (iOS-like switch) instead of
      macOS-native checkbox style. Makes app feel like iOS port.
    files_affected:
      - path: "Victor/Views/ConfigEditor/ConfigEditorView.swift"
        lines: [271, 277, 283, 291]
        toggles: ["Build Drafts", "Build Future", "Build Expired", "Enable robots.txt"]
      - path: "Victor/Views/Editor/Tabs/EssentialFieldsTab.swift"
        lines: [27]
        toggles: ["Mark as draft"]
      - path: "Victor/Views/Editor/Tabs/SEOTab.swift"
        lines: [108]
        toggles: ["Exclude from sitemap"]
      - path: "Victor/Views/Preferences/PreferencesView.swift"
        lines: [83, 115]
        toggles: ["Highlight current line", "Enable auto-save"]
    good_examples:
      - path: "Victor/Views/Inspector/MetadataSection.swift"
        lines: [29, 57]
        note: "Correctly uses .toggleStyle(.checkbox)"
    fix:
      code_change: "Add .toggleStyle(.checkbox) to all form toggles"
      before: |
        Toggle("Build Drafts", isOn: $config.buildDrafts)
      after: |
        Toggle("Build Drafts", isOn: $config.buildDrafts)
            .toggleStyle(.checkbox)
    estimated_effort: "20 minutes"

