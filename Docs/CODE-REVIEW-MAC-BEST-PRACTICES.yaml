    estimated_effort: "5 minutes"

  - id: HIGH-002
    title: "Asset Browser Missing Context Menus"
    severity: high
    category: interaction
    impact: "Reduced discoverability and Mac-like feel"
    description: |
      Asset grid and list items have no right-click context menu, which is
      expected on macOS. Users cannot right-click to copy path, reveal in Finder,
      or insert asset markdown.
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [205, 224]
    fix:
      code_change: "Add .contextMenu to AssetGridItem and AssetListRow"
      example: |
        .contextMenu {
            Button("Insert Markdown") { /* ... */ }
            Button("Copy Path") { /* ... */ }
            Divider()
            Button("Reveal in Finder") { /* ... */ }
            Button("Open in Default App") { /* ... */ }
        }
    estimated_effort: "1 hour"

  - id: HIGH-003
    title: "Asset Browser Tap Gesture Conflicts"
    severity: high
    category: interaction
    impact: "Duplicate selection handlers"
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [205, 208, 226]
    fix:
      code_change: |
        Remove .onTapGesture from list rows (List handles selection).
        Keep for grid items since LazyVGrid isn't a List.
    estimated_effort: "15 minutes"

  - id: HIGH-004
    title: "Missing Hover Effects on Asset Browser"
    severity: high
    category: interaction
    impact: "Reduced visual feedback and discoverability"
    description: |
      Asset grid and list items provide no hover feedback to indicate they're
      interactive. macOS users expect hover states.
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [280, 300]
    fix:
      code_change: "Add .onHover modifier with background highlight"
      example: |
        @State private var isHovered = false

        AssetGridItem(...)
            .onHover { hovering in isHovered = hovering }
            .background(isHovered ? Color.accentColor.opacity(0.1) : Color.clear)
    estimated_effort: "30 minutes"

  - id: HIGH-005
    title: "Corner Radius Values Too Large (iOS-sized)"
    severity: high
    category: styling
    impact: "Visual inconsistency with macOS design language"
    description: |
      Multiple files use 8pt corner radius which is iOS-style.
      macOS typically uses 4-6pt for UI elements.
    files_affected:
      - path: "Victor/Views/AssetBrowser/AssetDetailPanel.swift"
        lines: [94, 109]
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [280, 300]
    good_examples:
      - path: "Victor/Views/MainWindow/FileListView.swift"
        lines: [160, 171, 297]
        note: "Uses 3pt (better for Mac)"
      - path: "Victor/Views/Editor/TextEditorPanel.swift"
        lines: [52]
        note: "Uses 4pt (appropriate)"
    fix:
      code_change: "Reduce from 8pt to 4-6pt"
    estimated_effort: "10 minutes"

  - id: HIGH-006
    title: "Small Padding Values (iOS-sized)"
    severity: high
    category: styling
    impact: "Cramped UI compared to macOS standards"
    description: |
      Multiple files use 6pt/2pt padding which is too small for macOS.
      macOS prefers 8-12pt vertical, 12-16pt horizontal for form elements.
    files_affected:
      - path: "Victor/Views/ConfigEditor/ConfigEditorView.swift"
        lines: [107, 108]
      - path: "Victor/Views/AssetBrowser/AssetBrowserView.swift"
        lines: [293, 294]
      - path: "Victor/Views/MainWindow/FrontmatterBottomPanel.swift"
        lines: [49, 50]
    fix:
      code_change: "Increase to 8-12pt vertical, 12pt horizontal minimum"
    estimated_effort: "20 minutes"

  - id: HIGH-007
    title: ".navigationSubtitle() Has No Effect on macOS"
    severity: high
    category: api_usage
    impact: "Dead code, iOS-specific modifier"
    description: |
      NavigationSplitView on macOS doesn't display .navigationSubtitle().
      This modifier is iOS/iPadOS-only.
    files_affected:
      - path: "Victor/Views/MainWindow/EditorPanelView.swift"
        lines: [106, 107]
      - path: "Victor/Views/MainWindow/PreviewPanel.swift"
        lines: [24, 25]
    fix:
      code_change: "Remove .navigationSubtitle() or use window title API"
      alternative: |
        // If subtitle is important, set window title directly:
        .onAppear {
            if let window = NSApplication.shared.windows.first {
                window.title = "Preview - \(contentFile.fileName)"
            }
        }
    estimated_effort: "15 minutes"

  - id: HIGH-008
    title: "Missing Context Menu on Recent Sites"
    severity: high
    category: interaction
    impact: "Can't remove from recent list or reveal in Finder"
    files_affected:
      - path: "Victor/Views/MainWindow/SidebarView.swift"
        lines: [119, 183]
    fix:
      code_change: "Add .contextMenu with Remove/Reveal actions"
    estimated_effort: "30 minutes"

  - id: HIGH-009
    title: "Missing Context Menu on Breadcrumb Segments"
    severity: high
    category: interaction
    impact: "Can't copy path or navigate from breadcrumb"
    files_affected:
      - path: "Victor/Views/MainWindow/BreadcrumbBar.swift"
        lines: [35]
    fix:
      code_change: "Add .contextMenu with Copy Path, Reveal, New File actions"
