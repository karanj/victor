    files: [Victor/Views/Editor/EditorTextView.swift]
    detail: >
      NSRange locations (UTF-16 offsets) are mixed with String.count (grapheme
      clusters) throughout the wrapper: performDragOperation clamps charIndex
      with string.count, applyMarkdownFormat computes selection offsets with
      .count, updateNSView validates the restored cursor with text.count.
      Documents containing emoji/multibyte characters get wrong cursor and
      selection placement. Fix by using (text as NSString).length and
      utf16-based arithmetic consistently. Same file: Coordinator.parent is
      never refreshed in updateNSView (stale struct copy; bindings still work
      but callbacks like onCursorPositionChange can go stale) - set
      context.coordinator.parent = self in updateNSView.

  - id: victor-lru
    title: "Wire up FileCacheManager.evictIfNeeded and onEviction"
    status: open
    priority: P3
    type: task
    files: [Victor/ViewModels/SiteViewModel.swift, Victor/Services/FileCacheManager.swift]
    detail: >
      FileCacheManager supports eviction (evictIfNeeded, onEviction callback)
      but SiteViewModel never calls it, so the edited-content string cache
      grows unbounded across a long session. SiteViewModel keeps a second,
      separate LRU (contentCacheOrder) for ContentFile/TextFile objects -
      consolidate the two so there is one eviction policy.

  - id: victor-rbo
    title: "LiveReloadClient: cap/backoff reconnect attempts"
    status: open
    priority: P4
    type: task
    files: [Victor/Services/LiveReloadClient.swift]
    detail: >
      scheduleReconnect retries every 2s forever after a WebSocket failure.
      If the Hugo server is gone for good this spins indefinitely (each retry
      now tears down the old session, so no leak, but it is still wasted work
      and log noise). Add exponential backoff with a cap, and stop retrying
      once the server status is .stopped.

  - id: victor-prt
    title: "isPortAvailable: bind without SO_REUSEADDR gives false negatives"
    status: open
    priority: P4
    type: bug
    files: [Victor/Services/HugoServerService.swift]
    detail: >
      The availability probe binds a test socket without SO_REUSEADDR, so a
      port in TIME_WAIT (e.g. right after stopping the server) reads as taken
      and the server silently drifts to port+1. Set SO_REUSEADDR on the probe
      socket before bind.

  - id: victor-adp
    title: "AssetService: no in-flight guard against duplicate metadata loads"
    status: open
    priority: P3
    type: bug
    files: [Victor/Views/AssetBrowser/AssetBrowserView.swift]
    detail: >
      From Phase 3 review (2026-07-05): loadMetadataIfNeeded checks
      !asset.isMetadataLoaded before an await; SwiftUI re-invokes a grid
      cell's .task on fast scroll, so two overlapping invocations both pass
      the guard and duplicate the NSImage decode + actor call. Idempotent
      (last-write-wins) so not a correctness break - wasted CPU and
      possible thumbnail flicker. Add an in-progress Set<URL> guard at the
      call site or in the actor.

  - id: victor-frv
    title: "FileRowView: delete nonisolated(unsafe) by snapshotting into FileRowViewModel"
    status: open
    priority: P4
    type: task
    files: [Victor/Views/MainWindow/FileListView.swift]
    detail: >
      From Phase 3 review (2026-07-05): the nonisolated(unsafe) let node
      suppression is judged safe today (Equatable only consulted by
      MainActor SwiftUI diffing) but could be deleted outright by folding
      the row's remaining direct node reads into FileRowViewModel's
      existing snapshot pattern, so Equatable never holds the raw class
      reference.

  - id: victor-sbx
    title: "App Sandbox is not actually enabled (empty entitlements)"
    status: open
    priority: P3
    type: bug
    files: [Victor/Victor.entitlements, project.yml]
    detail: >
      Found during WP2.1 (2026-07-04): Victor.entitlements is an empty
      dict, so App Sandbox is off despite the codebase being written for it
      (security-scoped bookmarks, CLAUDE.md assumptions). Enable
      com.apple.security.app-sandbox + user-selected.read-write, then
      re-verify on a clean install: bookmark minting/resolution, Dock-drop
      URL grants (victor-doc's deferred check), Hugo server subprocess
      launch (may need entitlement exceptions or an unsandboxed helper -
      investigate; hugo spawning is the likely blocker and the reason this
      needs its own spike rather than just flipping the key).

  - id: victor-lsi
    title: "SiteViewModel.init side effect: unconditional loadSavedSite Task"
    status: open
    priority: P4
    type: task
    files: [Victor/ViewModels/SiteViewModel.swift]
    detail: >
      Found during Phase 1 review fixes (2026-07-04): init() spawns a
      background Task restoring the bookmarked site from real UserDefaults.
      Any async test constructing SiteViewModel on a machine with a
      bookmarked site can have fileNodes/selectedNode silently overwritten
      mid-test (both new test files now clear hugoSiteBookmark in setUp as
      a workaround). Move the restore call out of init to an explicit
      onLaunch entry point (VictorApp calls it once), removing the
      init-time I/O side effect. Related: victor-zw4 (DI would also solve).

  - id: victor-ea5
    title: "Extend EditorActions to the five specialized editors"
    status: open
    priority: P3
    type: task
    files:
      - Victor/Views/Components/EditorToolbarButtons.swift
      - Victor/Views/ConfigEditor/ConfigEditorView.swift
      - Victor/Views/DataEditor/DataFileEditorView.swift
      - Victor/Views/TranslationEditor/TranslationEditorView.swift
      - Victor/Views/TemplateEditor/TemplateEditorView.swift
      - Victor/Views/ArchetypeEditor/ArchetypeEditorView.swift
    detail: >
      Found during WP1.3 (2026-07-04): Config/Data/Translation/Template/
      Archetype editors bind Cmd+S locally via EditorToolbarButtons and
      publish no EditorActions focused value, so File > Save shows disabled
      there while the local button owns the shortcut (no double-fire, but
      the menu's validation/confirmation is bypassed). Publish EditorActions
      (formatting/shortcode nil) from each and drop the local shortcut,
      making the File menu the single Cmd+S owner everywhere.
    status: open
    priority: P4
    type: bug
    files: [Victor/Views/MainWindow/ContentView.swift]
    detail: >
      Found during WP1.1 (2026-07-04): NavigationSplitView exposes no
      SwiftUI hook for divider-position autosave (columnVisibility is plain
      @State; width isn't covered by SceneStorage). Options: bridge to the
      underlying NSSplitViewController autosaveName via the WindowAccessor
      introspection point, or persist navigationSplitViewColumnWidth input
      from a stored AppSettings value. Low priority - window frame,
      inspector state, and selection all persist already.

  - id: victor-ilf
    title: "isLoadingFile flag races across rapid file switches"
    status: open
    priority: P4
    type: bug
    files: [Victor/ViewModels/SiteViewModel.swift]
    detail: >
      selectNode sets isLoadingFile=true per load but any finishing load sets
      it back to false, even if a newer load is still in flight - switching
      files quickly can briefly show unloaded content without the loading
      state. Guard the reset with a nodeID check like the content updates,
      or track a loading generation counter.
