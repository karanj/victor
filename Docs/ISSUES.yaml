  - id: victor-ilf
    title: "isLoadingFile flag races across rapid file switches"
    status: open
    priority: P4
    type: bug
    files: [Victor/ViewModels/SiteViewModel.swift]
    estimate: 30m
    detail: >
      selectNode sets isLoadingFile=true per load but any finishing load sets
