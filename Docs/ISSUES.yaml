  # ── Editor UX ────────────────────────────────────────────────

  - id: victor-thm
    title: "Editor and preview theme system"
    status: open
    priority: P3
    type: feature
    files:
      - Victor/Models/EditorTheme.swift (new)
      - Victor/Services/ThemeService.swift (new)
      - Victor/Views/PreferencesView.swift
      - Victor/Services/MarkdownRenderer.swift
    estimate: 1-2d
    detail: >
      Define EditorTheme model: background, text, cursor colors + per-token-type
      colors (keyword, string, comment, etc.) + preview CSS overrides. Ship 3 built-in
      themes: Light (system default colors), Dark (Xcode-dark inspired), Sepia (warm
      background, dark brown text — popular for writing). Store as JSON in app bundle,
      user themes in ~/Library/Application Support/Victor/themes/.

      ThemeService: loads built-in + user themes, provides current theme (reactive
      via @Observable), persists selection in settings. EditorTextView reads token
      colors from current theme. MarkdownRenderer injects theme's preview CSS into
      the HTML template. PreferencesView gets a Theme section with theme picker,
      live preview swatch, and per-token color customization.

      CodeEdit's theme system supports import/export/duplicate and fuzzy search —
      Victor can start simpler with just a picker and built-in themes, adding
      customization later.

  - id: victor-cfl
    title: "Code folding for frontmatter and template blocks"
    status: open
    priority: P3
    type: feature
    files:
      - Victor/Views/Editor/EditorTextView.swift
    estimate: 1d
    detail: >
      Add code folding to the editor, initially targeting two cases: (1) YAML/TOML
      frontmatter blocks (--- to ---) and (2) Go template blocks ({{ define }} to
      {{ end }}). Show fold indicators in the gutter (requires victor-lnr for gutter
      infrastructure, though technically independent — can use a minimal fold margin).

      Implementation: use NSTextView's built-in folding support via
      NSLayoutManager.setTemporaryAttribute(.foldingIndicator) or implement custom
      folding by replacing folded ranges with a placeholder attachment ("...") and
      storing the original text. Click gutter indicator or Cmd+Option+[ to fold,
      Cmd+Option+] to unfold. Folded state per file, persisted in session state.

      CodeEdit implements folding based on indentation with syntax-aware folding
      planned. For Victor's use case, the two targeted fold points (frontmatter,
      template blocks) cover the primary needs without full indentation-based folding.

