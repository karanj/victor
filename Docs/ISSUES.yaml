  # Epic: victor-iv0 — auto-reload on external file changes

  - id: victor-bfs
    title: "Create FileWatcherService actor"
    status: open
    priority: P2
    type: task
    blocks: [victor-5cl, victor-so7]
    files: [Victor/Services/FileWatcherService.swift (new), Victor/AppConstants.swift]
    estimate: 2-3h
    detail: >
      Actor managing FSEventStream lifecycle. startWatching/stopWatching,
      registerSaveIntent (5s expiry), event coalescing (100ms window in Swift).
      Define FileChangeEvent, FileChangeBatch, FileWatcherDelegate types.
      Add FileWatcher constants to AppConstants.

      FSEvents flags: kFSEventStreamCreateFlagFileEvents (file-level granularity)
      + kFSEventStreamCreateFlagUseExtendedData (metadata) + kFSEventStreamCreateFlagNoDefer
      (events fire immediately, no FSEvents-side buffering). Apply the 100ms debounce
      in Swift via a DispatchWorkItem rather than relying on FSEvents' latency param —
      this gives precise control and avoids the coalescing window eating rapid saves.
      Validated by CodeEdit's DirectoryEventStream production implementation.

