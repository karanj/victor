  - id: victor-cjp
    title: "Plain-text editor: cursor jumps to end of file ~1s after pausing typing"
    status: open
    priority: P2
    type: bug
    files:
      - Victor/Views/Editor/TextEditorPanel.swift
      - Victor/Services/SyntaxHighlighter.swift
      - Victor/ViewModels/TextEditorViewModel.swift
    detail: >
      User-reported (2026-07-06, while typing in a JavaScript file): pause typing
      for about a second and the insertion point jumps to the bottom of the file,
      making the plain-text editor unusable for real editing. Two suspects, both
      on ~1s-after-last-keystroke timers, in likely order: (1) the syntax
      highlighting debounce in TextEditorTextView.Coordinator.textDidChange
      (0.3s Timer -> applySyntaxHighlighting) — if SyntaxHighlighter.applyHighlighting
      replaces the whole attributed string (setAttributedString) rather than
      applying attribute runs in place, AppKit resets the insertion point to the
      end of the replaced range; (2) the auto-save writeback path — if the save
      mutates state that flows back into TextEditorTextView.updateNSView's
      `textView.string != text` branch with a stale/normalized string, the full
      `textView.string = text` replacement moves the cursor (its
      selectedRanges save/restore may not survive the replacement). Repro first
      with highlighting disabled (non-highlighted file type, e.g. .txt) to split
      the two. Fix should preserve selection across whichever mutation is at
      fault; add a regression test at the coordinator/viewmodel level if the
      cause is (2), or a highlighting-preserves-selection test if (1).
      Markdown editor (EditorTextView/HighlightingTextView) is unaffected — it
      has no highlighting timer and its updateNSView guards by count+equality.

  - id: victor-lnr
    title: "Line numbers gutter in editor"
    status: open
    priority: P2
    type: feature
    files:
      - Victor/Views/Editor/EditorTextView.swift
    detail: >
      Add a line number gutter to the NSTextView-based editor. NSTextView supports
      this via NSRulerView — subclass NSRulerView to draw line numbers in the gutter
      aligned with each text line. Account for line wrapping (wrapped lines share the
      same line number). Use layoutManager.enumerateLineFragments to map visual lines
      to logical line numbers. Style: monospaced font, dimmed color, right-aligned,
      current line highlighted. Should respect font size changes. CodeEdit implements
      this in their CodeEditTextView package via a custom gutter renderer — the
      NSRulerView approach is simpler and sufficient for Victor's single-editor model.

  - id: victor-tab
    title: "Tab bar for open files"
    status: open
    priority: P2
    type: feature
    blocks: [victor-trs]
    files:
      - Victor/Views/Editor/TabBarView.swift (new)
      - Victor/Views/MainWindow/ContentView.swift
      - Victor/ViewModels/SiteViewModel.swift
    detail: >
      Horizontal tab bar above the editor area showing recently-opened files. Each
      tab shows the filename (with parent folder if ambiguous, e.g. two index.md files).
      Close button (x) on hover. Active tab visually distinct. Clicking a tab switches
      selectedNode in SiteViewModel. Tabs persist in openFiles: [FileNode] on
      SiteViewModel — opening a file adds to the list, closing removes. Limit to ~15
      tabs, oldest auto-closed. New tabs insert after the currently active tab (CodeEdit
      pattern). Tab ordering via drag-and-drop is nice-to-have but not required for v1.
      No split editor support needed — single editor pane with tab switching.

      Data model: Add openTabs: [UUID] and activeTabID: UUID? to SiteViewModel.
      selectFile() adds to openTabs if not present, sets activeTabID. closeTab(id:)
      removes from openTabs, selects adjacent tab. Wire into ContentView between
      toolbar and editor area.

  - id: victor-trs
    title: "Session restoration (tabs, selected file, window state)"
    status: blocked
    priority: P2
    type: feature
    blocked_by: [victor-tab]
    files:
      - Victor/VictorApp.swift
      - Victor/ViewModels/SiteViewModel.swift
      - Victor/Models/SessionState.swift (new)
    detail: >
      Persist editor session state across app restarts. Save to JSON at
      ~/Library/Application Support/Victor/session.json on app termination
      and periodically (every 30s). Restore on launch if the same site is opened.

      SessionState struct: siteURL, openTabIDs (matched by relative file path since
      UUIDs regenerate on reload), activeTabRelativePath, per-file cursor positions
      and scroll offsets (keyed by relative path). On restore: reload site tree,
      match saved relative paths to new FileNode UUIDs, reopen tabs, restore
      active selection. Gracefully handle missing files (skip, don't error).
      Use Codable for serialization. Depends on tab bar (victor-tab) for the
      open-tabs data model.

  - id: victor-bcr
    title: "Breadcrumb navigation bar"
    status: open
    priority: P2
    type: feature
    files:
      - Victor/Views/Editor/BreadcrumbBarView.swift (new)
      - Victor/Views/MainWindow/ContentView.swift
      - Victor/ViewModels/SiteViewModel.swift
    detail: >
      Horizontal breadcrumb bar showing the selected file's path within the Hugo site,
      displayed between the tab bar and editor area. Example: content > posts > 2026 >
      my-post.md. Each path segment is a clickable button that opens a dropdown menu
      listing sibling files/folders at that level. Selecting a sibling navigates to it
      (folders expand in sidebar, files open in editor).

      Implementation: decompose selectedNode's path relative to site root into segments.
      For each segment, query FileNode tree for siblings. Use SwiftUI Menu or popover
      for dropdowns. Show file type icons in dropdowns. Truncate long paths from the
      left with "..." if the breadcrumb overflows. Especially valuable for Hugo sites
      with deep content/ hierarchies (e.g. content/en/docs/guides/getting-started.md).
      CodeEdit implements this with folder + symbol navigation — Victor only needs
      folder/file level since markdown symbols aren't relevant for CMS use.

  - id: victor-qop
    title: "Quick open file finder (Cmd+P)"
    status: open
    priority: P2
    type: feature
    files:
      - Victor/Views/GlobalSearch/QuickOpenView.swift (new)
      - Victor/Views/MainWindow/ContentView.swift
      - Victor/ViewModels/SiteViewModel.swift
    detail: >
      Keyboard-triggered (Cmd+P or Cmd+Shift+O) floating panel for fuzzy file name
      search. Shows a text field with results updating as user types. Results ranked by
      fuzzy match score, showing filename + relative path + file type icon. Enter opens
      the selected file, Escape dismisses. Arrow keys navigate results.

      Implementation: flatten FileNode tree into [FileNode], fuzzy match against
      node.name using a simple subsequence scoring algorithm (bonus for consecutive
      matches, prefix matches, and path segment boundaries). Show top 15 results.
      Render as a .sheet or floating NSPanel centered in the window. Distinct from
      GlobalSearchView which searches file *contents* — this searches file *names* only
      and is optimized for speed (no disk I/O, operates on in-memory tree).

      Fuzzy match algorithm: score each candidate by iterating query chars against
      filename chars. Award points for: consecutive matches (+2), first-char match (+3),
      after separator (/ . - _) match (+2), case-exact match (+1). Sort by score desc.

