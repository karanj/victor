  # ── Mac-arsed gap closure (2026-07-11 skill audit; plan: MAC-ARSED-GAP-PLAN.md) ──

  - id: victor-spl
    title: "G1: Edit menu lost system text services; no spell checking"
    status: open
    priority: P2
    type: bug
    files:
      - Victor/VictorApp.swift
      - Victor/Views/Editor/EditorTextView.swift
      - Victor/Models/AppSettings.swift
      - Victor/Views/Preferences/PreferencesView.swift
    detail: >
      CommandGroup(replacing: .textEditing) in VictorApp.swift installs the
      Find commands but that placement is also where macOS puts Spelling and
      Grammar, Substitutions, Transformations, and Speech - replacing it
      removed all of them from the Edit menu. Compounding: EditorTextView
      never sets isContinuousSpellCheckingEnabled, so a prose-writing CMS
      ships with spell checking off and no menu to enable it. Fix: prototype
      whether the default .textEditing group's Find items route to the
      NSTextView find bar via responder chain (if yes, delete the replacement
      and add only Find in Files via CommandGroup(after:)); if not, keep the
      replacement and re-add the four system submenus via responder-chain
      selectors (extend the FindPanelHelper pattern). Either way: new
      AppSettings.checkSpellingWhileTyping (default true) driving
      isContinuousSpellCheckingEnabled, surfaced as menu toggle + Preferences
      checkbox. Smart quotes/dashes stay off (deliberate, markdown).

