  - id: victor-stn
    title: "Settings: JSON-based preferences with typed property wrapper"
    status: open
    priority: P2
    type: task
    blocks: [victor-8cw]
    files:
      - Victor/Services/SettingsService.swift (new)
      - Victor/Models/AppSettings.swift (new)
      - Victor/Views/PreferencesView.swift
    estimate: 6h
    detail: >
      Replace scattered UserDefaults access with a single JSON file at
      ~/Library/Application Support/Victor/settings.json. Define typed
      SettingsData struct (sections: General, Editor, FileWatching, Preview).
      Generic @AppSettings<T> property wrapper for type-safe access — no magic
