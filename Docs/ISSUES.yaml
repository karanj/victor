  - id: victor-sel
    title: "G3: Sidebar selection model - multi-select, Delete key, Cmd+C, drag out"
    status: open
    priority: P3
    type: feature
    blocked_by: [victor-rnm]
    files:
      - Victor/Views/MainWindow/FileListView.swift
      - Victor/Views/MainWindow/SidebarView.swift
      - Victor/ViewModels/SiteViewModel.swift
      - Victor/Views/AssetBrowser/AssetBrowserView.swift
    detail: >
      Sidebar List is single-select (selectedFileID: UUID?) with per-row
      .contextMenu, so: no Shift/Cmd-click, right-click cannot act on a
      selection set, Delete key does nothing, Cmd+C puts nothing on the
      pasteboard (copy is context-menu "Copy Path" only), and rows are not
      drag sources (drops in only - asset browser is the only drag-out).
      Scope: (a) List selection becomes Set<UUID> with a derived single
      "lead" selection driving the editor; (b) migrate to
      .contextMenu(forSelectionType: UUID.self) so right-click acts on the
      full selection; (c) onDeleteCommand -> moveToTrash over the selection;
      (d) Cmd+C via onCopyCommand putting file URLs (multi-format: fileURL +
      path string) on the pasteboard; (e) rows draggable out via the
      NSItemProvider(contentsOf:) pattern extracted from
      AssetBrowserView.assetDragItemProvider into a shared helper (DRY);
      (f) drag-to-move between sidebar folders with a real FileSystemService
      move. Excluded with rationale: type-to-select (SwiftUI List does not
      support it; would require NSOutlineView - not worth the substrate swap).
      Blocked by victor-rnm only to sequence FileListView churn, not a hard
      dependency.

  - id: victor-und
    title: "G4: Undo for file operations (rename, duplicate, trash, move)"
    status: open
    priority: P3
    type: feature
    blocked_by: [victor-rnm, victor-sel]
    files:
      - Victor/ViewModels/SiteViewModel.swift
      - Victor/Services/FileSystemService.swift
      - Victor/Services/FileOperationsService.swift
    detail: >
      No UndoManager use outside NSTextView typing. Skill rule: named undo
      actions ("Undo Rename", "Undo Move to Trash") preferred over
      confirmation dialogs. Groundwork already exists:
      FileSystemService.moveToTrash calls trashItem(resultingItemURL:) and
      discards the trashed URL - return it up the chain so undo can move the
      item back. Register inverse operations on the window's UndoManager
      (@Environment(\.undoManager) threaded into the file-operation call
      sites) with setActionName for each op: rename<->rename back,
      duplicate<->trash the copy, trash<->put back from trashed URL,
      move<->move back. Excluded with rationale: frontmatter form-level undo
      (fields already get NSTextField-local text undo; whole-form undo is a
      separate design problem).

